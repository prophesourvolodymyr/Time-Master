name: TmaxDriver
options:
  bundleIdPrefix: com.timemaster.recordings
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  TmaxDriverHost:
    type: application
    platform: iOS
    sources:
      - path: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timemaster.recordings.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  TmaxDriverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: TmaxDriverHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timemaster.recordings.driver
schemes:
  TmaxDriver:
    build:
      targets:
        TmaxDriverHost: all
        TmaxDriverUITests: [test]
    test:
      targets:
        - TmaxDriverUITests
