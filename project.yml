name: TimeMaster
options:
  bundleIdPrefix: com.timemaster
  deploymentTarget:
    iOS: "16.0"
    macOS: "14.0"
  xcodeVersion: "15.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    TM_RANKED_SERVICE_URL: ""
    TM_SUPABASE_URL: "https://ecvfkthbuxijzeszgiam.supabase.co"
    TM_SUPABASE_ANON_KEY: "sb_publishable_0S-Uv1TX6TbNoKCDl9pbzQ_Km2EJ2Id"
    TM_SYNC_SERVICE_URL: ""
  configs:
    Debug:
      "TM_RANKED_SERVICE_URL[sdk=iphonesimulator*]": "http://127.0.0.1:8765"
      "TM_RANKED_SERVICE_URL[sdk=macosx*]": "http://127.0.0.1:8765"
      "TM_SYNC_SERVICE_URL[sdk=iphonesimulator*]": "http://127.0.0.1:8765"
      "TM_SYNC_SERVICE_URL[sdk=macosx*]": "http://127.0.0.1:8765"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.0"
  SwiftMP3:
    url: https://github.com/mierau/swift-mp3.git
    revision: c33793f5e5725e941b12efd375691db7c98b86ec
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.0.0"
  TimeMasterCore:
    path: TimeMasterCore
  TimeMasterRouting:
    path: routing/TimeMasterRouting
targets:
  TimeMaster:
    type: application
    platform: iOS
    sources:
      - path: TimeMaster
        excludes:
          - "**/.DS_Store"
          - "Resources/MapGlyphs"
          - "Resources/OfflineRouting"
          - "Info-macOS.plist"
          - "junk"
      - path: TimeMasterShared
      - path: TimeMaster/Resources/MapGlyphs
        type: folder
      - path: TimeMaster/Resources/OfflineRouting
        type: folder
    dependencies:
      - package: ZIPFoundation
      - package: SwiftMP3
      - package: MapLibre
      - package: TimeMasterCore
      - package: TimeMasterRouting
      - sdk: libsqlite3.tbd
      - target: TimeMasterWidget
    settings:
      base:
        INFOPLIST_FILE: TimeMaster/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Tmax
        INFOPLIST_KEY_NSCameraUsageDescription: "Tmax uses the camera for local exercise tracking and guided Physique stills. Exercise Ranked sends joint estimates, never images. Physique shares only selected face-obscured stills after separate consent."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Tmax needs photo library access to add photos of your exercises"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Tmax saves your Planned Trip map image to Photos so you can share it."
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: TimeMaster/TimeMaster.entitlements
        TM_EXPLORE_STYLE_URL: "https://tiles.openfreemap.org/styles/liberty"
        TM_EXPLORE_OFFLINE_ALLOWED: NO
        TM_MAPTILER_KEY: ""
        TM_MAPTILER_TERRAIN_STYLE_URL: ""
        TM_MAPTILER_SATELLITE_STYLE_URL: ""
        TM_MAPTILER_3D_STYLE_URL: ""
        TM_MAPTILER_CYCLING_STYLE_URL: ""
        TM_MAPTILER_DARK_STYLE_URL: ""
        TM_MAPTILER_OFFLINE_STYLE_URL: ""
        TM_MAPTILER_OFFLINE_LICENSED: NO
        TM_TERRAIN_DEM_URL: "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"
        TM_SATELLITE_RASTER_TILE_URL: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
        TM_TOMTOM_TRAFFIC_TILE_URL: ""
        TM_TOMTOM_TRAFFIC_KEY: ""
        TM_TOMTOM_TRAFFIC_SOURCE_LAYER: "flow"
        TM_LICENSED_TRANSIT_FEED_URL: ""
        TM_LICENSED_TRANSIT_TILE_URL: ""
        TM_LICENSED_TRANSIT_SOURCE_LAYER: "transit"
        TM_LICENSED_TRANSIT_ATTRIBUTION: ""
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": YES
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

  TimeMasterWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TimeMasterWidget
        excludes:
          - "**/.DS_Store"
      - path: TimeMasterShared
    settings:
      base:
        INFOPLIST_FILE: TimeMasterWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: TimeMasterWidget/TimeMasterWidget.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.timemaster.TimeMaster.TimeMasterWidget
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_KEY_CFBundleDisplayName: Tmax
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": YES
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
  TimeMasterTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: TimeMasterTests
    dependencies:
      - target: TimeMaster
      - package: TimeMasterCore
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timemaster.TimeMasterTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  TimeMasterUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TimeMasterUITests
    dependencies:
      - target: TimeMaster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timemaster.TimeMasterUITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  TimeMaster-macOS:
    type: application
    platform: macOS
    sources:
      - path: TimeMaster
        excludes:
          - "**/.DS_Store"
          - "Resources/MapGlyphs"
          - "Resources/OfflineRouting"
          - "Info.plist"
          - "junk"
    dependencies:
      - package: ZIPFoundation
      - package: SwiftMP3
      - package: TimeMasterCore
    settings:
      base:
        INFOPLIST_FILE: TimeMaster/Info-macOS.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Tmax
        CODE_SIGN_ENTITLEMENTS: TimeMaster/TimeMaster-macOS.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.timemaster.macos
        PRODUCT_NAME: Tmax
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  TimeMaster:
    build:
      targets:
        TimeMaster: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TimeMasterUITests
        - TimeMasterTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  TimeMaster-macOS:
    build:
      targets:
        TimeMaster-macOS: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

