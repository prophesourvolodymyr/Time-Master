name: TimeMaster
options:
  bundleIdPrefix: com.timemaster
  deploymentTarget:
    iOS: "16.0"
    macOS: "14.0"
  xcodeVersion: "15.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.0"
  SwiftMP3:
    url: https://github.com/mierau/swift-mp3.git
    from: "1.0"
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.0.0"
  LiquidGlassKit:
    url: https://github.com/ThijsMussig/LiquidGlassKit
    revision: 51ef8d187a466345882b90d281865ceec7bad3b0
  TimeMasterCore:
    path: TimeMasterCore
targets:
  TimeMaster:
    type: application
    platform: iOS
    sources:
      - path: TimeMaster
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: ZIPFoundation
      - package: SwiftMP3
      - package: MapLibre
      - package: LiquidGlassKit
      - package: TimeMasterCore
      - target: TimeMasterWidget
    settings:
      base:
        INFOPLIST_FILE: TimeMaster/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Time-Master needs camera access to take photos of your exercises"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Time-Master needs photo library access to add photos of your exercises"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: TimeMaster/TimeMaster.entitlements
        TM_EXPLORE_STYLE_URL: "https://tiles.openfreemap.org/styles/liberty"
        TM_EXPLORE_OFFLINE_ALLOWED: NO
        TM_MAPTILER_KEY: ""
        TM_MAPTILER_TERRAIN_STYLE_URL: ""
        TM_MAPTILER_SATELLITE_STYLE_URL: ""
        TM_MAPTILER_3D_STYLE_URL: ""
        TM_MAPTILER_CYCLING_STYLE_URL: ""
        TM_MAPTILER_DARK_STYLE_URL: ""
        TM_MAPTILER_OFFLINE_STYLE_URL: ""
        TM_MAPTILER_OFFLINE_LICENSED: NO
        TM_TERRAIN_RASTER_TILE_URL: "https://tile.opentopomap.org/{z}/{x}/{y}.png"
        TM_SATELLITE_RASTER_TILE_URL: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
        TM_TOMTOM_TRAFFIC_TILE_URL: ""
        TM_TOMTOM_TRAFFIC_KEY: ""
        TM_TOMTOM_TRAFFIC_SOURCE_LAYER: "flow"
        TM_LICENSED_TRANSIT_FEED_URL: ""
        TM_LICENSED_TRANSIT_TILE_URL: ""
        TM_LICENSED_TRANSIT_SOURCE_LAYER: "transit"
        TM_LICENSED_TRANSIT_ATTRIBUTION: ""
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  TimeMasterWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TimeMasterWidget
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: TimeMasterWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: TimeMasterWidget/TimeMasterWidget.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.timemaster.TimeMaster.TimeMasterWidget
        PRODUCT_NAME: "$(TARGET_NAME)"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  TimeMasterUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TimeMasterUITests
    dependencies:
      - target: TimeMaster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timemaster.TimeMasterUITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  TimeMaster-macOS:
    type: application
    platform: macOS
    sources:
      - path: TimeMaster
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: ZIPFoundation
      - package: SwiftMP3
      - package: TimeMasterCore
    settings:
      base:
        INFOPLIST_FILE: TimeMaster/Info-macOS.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TimeMaster/TimeMaster-macOS.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.timemaster.macos
        PRODUCT_NAME: "$(TARGET_NAME)"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  TimeMaster:
    build:
      targets:
        TimeMaster: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TimeMasterUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  TimeMaster-macOS:
    build:
      targets:
        TimeMaster-macOS: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

