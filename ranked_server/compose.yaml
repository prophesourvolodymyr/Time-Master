services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - competition:/data
    environment:
      RANKED_DATABASE: /data/ranked.sqlite3
      RANKED_REQUIRE_TLS: "true"
      RANKED_TRUST_PROXY: "true"
      SUPABASE_URL: ${SUPABASE_URL:?Set the Supabase project HTTPS URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set the public Supabase API key}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set the server-only Supabase service role key}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-tm-exercise-sync}
    networks: [private]
  https:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      RANKED_DOMAIN: ${RANKED_DOMAIN:?Set an authorized domain before deployment}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    networks: [private]
networks:
  private:
volumes:
  competition:
  certificates:
  caddy_config:
